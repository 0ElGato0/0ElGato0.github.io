<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ellen Joe Weapon AR</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }
    #status {
      position: fixed;
      z-index: 20;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      right: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.65);
      color: #fff;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">กำลังเปิดกล้อง…</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; colorManagement: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets timeout="60000">
      <a-asset-item
        id="ellenJoeWeapon"
        src="https://raw.githubusercontent.com/0ElGato0/0ElGato0.github.io/main/EllenJoeWeapon.glb">
      </a-asset-item>
    </a-assets>

    <!-- ใช้ Hiro marker ของ AR.js -->
    <a-marker
      id="hiro"
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <a-entity
        id="model"
        gltf-model="#ellenJoeWeapon"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const marker = document.getElementById('hiro');
    const model = document.getElementById('model');

    marker.addEventListener('markerFound', () => {
      status.textContent = 'พบ Hiro marker — แสดง Ellen Joe Weapon';
    });

    marker.addEventListener('markerLost', () => {
      status.textContent = 'เล็งกล้องไปที่ Hiro marker';
    });

    model.addEventListener('model-loaded', () => {
      status.textContent = 'โหลด EllenJoeWeapon.glb สำเร็จ';
    });

    model.addEventListener('model-error', (e) => {
      console.error('GLB error:', e);
      status.textContent = 'โหลดโมเดลไม่สำเร็จ — ตรวจสอบ URL/CORS';
    });

    window.addEventListener('load', () => {
      setTimeout(() => {
        if (status.textContent === 'กำลังเปิดกล้อง…') {
          status.textContent = 'อนุญาตกล้อง แล้วเล็งไปที่ Hiro marker';
        }
      }, 3000);
    });
  </script>
</body>
</html>
