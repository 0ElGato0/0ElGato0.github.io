<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Ellen Joe Weapon AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      text-align: center;
      font: 14px/1.4 system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="status">กำลังเปิดกล้อง…</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

    <!-- Ellen Joe Weapon -->
    <a-assets timeout="60000">
      <a-asset-item
        id="ellenJoeWeapon"
        src="https://raw.githubusercontent.com/0ElGato0/0ElGato0.github.io/main/EllenJoeWeapon.glb">
      </a-asset-item>
    </a-assets>

    <!-- Hiro Marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <a-entity
        id="weapon"
        gltf-model="#ellenJoeWeapon"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-entity>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const marker = document.getElementById("hiroMarker");
    const weapon = document.getElementById("weapon");

    marker.addEventListener("markerFound", () => {
      status.textContent = "พบ Hiro marker — แสดง Ellen Joe Weapon";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent = "ไม่พบ Hiro marker — เล็งกล้องไปที่ marker";
    });

    weapon.addEventListener("model-loaded", () => {
      status.textContent = "โหลดโมเดลสำเร็จ — เล็งกล้องไปที่ Hiro marker";
    });

    weapon.addEventListener("model-error", (event) => {
      console.error("GLB load error:", event);
      status.textContent = "โหลด EllenJoeWeapon.glb ไม่สำเร็จ";
    });

    window.addEventListener("load", () => {
      setTimeout(() => {
        const video = document.querySelector("video");

        if (video) {
          status.textContent = "กล้องพร้อม — เล็งไปที่ Hiro marker";
        } else {
          status.textContent =
            "ไม่พบกล้อง — อนุญาต Camera และเปิดผ่าน HTTPS/localhost";
        }
      }, 3000);
    });
  </script>

</body>
</html>
