<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ellen Joe Weapon — Hiro AR</title>

  <!-- Official-style AR.js marker build -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    #start {
      position: fixed;
      z-index: 10000;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    #start button {
      border: 0;
      border-radius: 16px;
      padding: 18px 28px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: #e91e63;
      box-shadow: 0 8px 30px #0008;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 10px;
      right: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #000b;
      color: #fff;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }

    #help {
      position: fixed;
      z-index: 9998;
      left: 12px;
      right: 12px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      padding: 10px;
      border-radius: 12px;
      background: #000b;
      color: #fff;
      text-align: center;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="start">
    <button id="startButton">📷 เริ่มกล้อง AR</button>
  </div>

  <div id="status">กด “เริ่มกล้อง AR” เพื่ออนุญาตกล้อง</div>
  <div id="help">หลังกล้องเปิด ให้นำ Hiro marker มาส่อง</div>

  <a-scene
    id="scene"
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true; precision: medium">

    <a-assets timeout="60000">
      <a-asset-item
        id="weapon"
        src="https://raw.githubusercontent.com/0ElGato0/0ElGato0.github.io/main/EllenJoeWeapon.glb">
      </a-asset-item>
    </a-assets>

    <a-marker
      id="hiro"
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <a-entity
        id="model"
        gltf-model="#weapon"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const scene = document.getElementById('scene');
    const start = document.getElementById('start');
    const button = document.getElementById('startButton');
    const status = document.getElementById('status');
    const marker = document.getElementById('hiro');
    const model = document.getElementById('model');

    async function startAR() {
      button.disabled = true;
      status.textContent = 'กำลังขอสิทธิ์ใช้กล้อง…';

      if (!window.isSecureContext &&
          location.hostname !== 'localhost' &&
          location.hostname !== '127.0.0.1') {
        status.textContent = 'ต้องเปิดผ่าน HTTPS หรือ localhost';
        button.disabled = false;
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = 'Browser นี้ไม่รองรับการเปิดกล้อง';
        button.disabled = false;
        return;
      }

      try {
        // User gesture explicitly grants camera permission first.
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        // AR.js will create/use its own webcam video after permission is granted.
        stream.getTracks().forEach(track => track.stop());

        status.textContent = 'กำลังเริ่ม AR.js…';
        start.style.display = 'none';

        // Initialize AR.js only after a successful user gesture + camera permission.
        scene.setAttribute(
          'arjs',
          'sourceType: webcam; videoTexture: true; trackingMethod: best; debugUIEnabled: false;'
        );

        setTimeout(() => {
          const video = document.querySelector('video');
          if (video) {
            video.setAttribute('playsinline', '');
            video.setAttribute('autoplay', '');
            video.muted = true;
            status.textContent = 'กล้องพร้อม — เล็งไปที่ Hiro marker';
          } else {
            status.textContent = 'AR.js ยังไม่พบกล้อง — ตรวจสอบสิทธิ์ Camera';
          }
        }, 2500);

      } catch (err) {
        console.error(err);
        if (err.name === 'NotAllowedError') {
          status.textContent = 'ไม่อนุญาตกล้อง — กด Allow/อนุญาต Camera';
        } else if (err.name === 'NotFoundError') {
          status.textContent = 'ไม่พบกล้องบนอุปกรณ์นี้';
        } else {
          status.textContent = 'เปิดกล้องไม่ได้: ' + err.name;
        }
        button.disabled = false;
      }
    }

    button.addEventListener('click', startAR);

    marker.addEventListener('markerFound', () => {
      status.textContent = '🎯 พบ Hiro marker — แสดง Ellen Joe Weapon';
    });

    marker.addEventListener('markerLost', () => {
      status.textContent = 'กล้องพร้อม — เล็งไปที่ Hiro marker';
    });

    model.addEventListener('model-loaded', () => {
      status.textContent = 'โมเดลโหลดแล้ว — เล็งไปที่ Hiro marker';
    });

    model.addEventListener('model-error', (event) => {
      console.error('GLB error:', event);
      status.textContent = 'โหลด EllenJoeWeapon.glb ไม่สำเร็จ';
    });
  </script>
</body>
</html>
